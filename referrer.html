<style>
.zuzu-journey{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;color:light-dark(#262225,#f4edf1);color-scheme:light dark;--surface:light-dark(#fff,#171719);--subtle:light-dark(#f6f5f6,#222225);--incoming:light-dark(#e9e9eb,#333336);--ink:light-dark(#171719,#faf7f8);--quiet:light-dark(#6e6d74,#aaa7af);--line:light-dark(#dfdce1,#444148);--blue:#087afa;--rose:light-dark(#80585c,#edbdc4)}
.zuzu-journey *{box-sizing:border-box}.zuzu-journey [hidden]{display:none!important}.zuzu-journey .review-controls{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}.zuzu-journey label{font-size:12px;line-height:1.5;color:var(--quiet);flex:1;min-width:160px}.zuzu-journey select{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
.zuzu-journey .stage{padding:22px 12px;display:flex;justify-content:center;border-radius:16px}.zuzu-journey .phone{width:360px;max-width:100%;border:1px solid var(--line);border-radius:34px;background:var(--surface);box-shadow:0 12px 35px #00000012;overflow:hidden;color:var(--ink)}.zuzu-journey .statusbar{display:flex;justify-content:space-between;padding:16px 25px 8px;font-size:13px;font-weight:600}.zuzu-journey header{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:0 16px 12px;background:var(--subtle);border-bottom:1px solid var(--line)}.zuzu-journey .back{font-size:34px;color:var(--blue)}.zuzu-journey .contact{display:grid;justify-items:center;gap:5px;font-size:13px}.zuzu-journey .contact strong{font-weight:500}.zuzu-journey .avatar{display:grid;place-items:center;width:45px;height:45px;border-radius:50%;background:light-dark(#f0ded9,#584348);color:light-dark(#483436,#ffe8eb);font-size:16px;font-weight:600;letter-spacing:-1px}.zuzu-journey .conversation{padding:20px 14px 26px;min-height:385px;display:flex;flex-direction:column;gap:12px}.zuzu-journey .time{text-align:center;font-size:11px;color:var(--quiet);margin-bottom:8px}.zuzu-journey .bubble{max-width:86%;padding:11px 14px;border-radius:19px;font-size:15px;line-height:1.4;overflow-wrap:anywhere;background:var(--incoming);align-self:flex-start}.zuzu-journey .bubble p{margin:0}.zuzu-journey .bubble p+p{margin-top:10px}.zuzu-journey .bubble.outgoing{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}.zuzu-journey .bubble.incoming{border-bottom-left-radius:6px}.zuzu-journey .delivered{text-align:right;font-size:11px;color:var(--quiet);margin-top:-7px}.zuzu-journey .link{display:block;color:inherit;text-decoration:underline;margin-top:8px}.zuzu-journey .link-card{border-radius:16px;overflow:hidden;background:light-dark(#f6e9e2,#4b383a);max-width:86%;align-self:flex-end}.zuzu-journey .link-card .art{padding:24px 20px;font:italic 29px/1.12 Georgia,serif;color:light-dark(#67464b,#f5d9dc)}.zuzu-journey .link-card .meta{background:var(--subtle);padding:12px;font-size:12px;color:var(--ink);line-height:1.5}.zuzu-journey .composer{display:flex;align-items:center;gap:12px;padding:12px 14px 24px;border-top:1px solid var(--line);color:var(--quiet);font-size:23px}.zuzu-journey .input{flex:1;border:1px solid var(--line);border-radius:24px;padding:9px 14px;font-size:14px}.zuzu-journey .review-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px;font-size:12px;line-height:1.6;color:var(--quiet)}.zuzu-journey .review-footer button{background:var(--ink);color:var(--surface);padding:11px 15px;border:0;border-radius:20px;white-space:nowrap;font-size:12px;cursor:pointer}.zuzu-journey button:focus-visible,.zuzu-journey select:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.zuzu-journey button:disabled{opacity:.4;cursor:default}@media(max-width:420px){.zuzu-journey .review-controls{gap:10px}.zuzu-journey label{min-width:130px}.zuzu-journey .stage{padding:12px 0}.zuzu-journey .bubble{font-size:14px}.zuzu-journey .review-footer{align-items:start}.zuzu-journey .conversation{min-height:370px}}
</style>

function edition(n,member="Founding Member"){const c=n===5?["Puddle","Paper boat"]:["Twirl","Spinning top"];return cardTemplate.replaceAll("__NUMBER__",String(n).padStart(3,"0")).replaceAll("__EMBLEM__",cardAssets[n]).replaceAll("__CHARACTER__",c[0]).replaceAll("__ORIGIN__",c[1]).replaceAll("__MEMBER__",member)}
const bubble=(text,out=false)=>`<div class="bubble ${out?'outgoing':'incoming'}">${text}</div>`;
function render(){const n=cohort.value==='employee'?5:2,s=Number(step.value);root.querySelector('#ref-contact').textContent=s===1?'Neha':'zuzu';root.querySelector('.avatar').textContent=s===1?'N':'zuzu';root.querySelector('.avatar').classList.toggle('person-avatar',s===1);let html='<div class="time">iMessage · Today 9:41 AM</div>';
if(s===0)html+=bubble('Give me my referral link',true)+bubble(`You have ${n} invitations to zuzu.<p>Share this with someone you’d love to bring in.</p><span class="link">[your personal invite link]</span>`)+bubble('Your invitation is used only when someone joins.');
if(s===1)html+=bubble('I have an invitation to zuzu for you. Thought you’d love this.',true)+'<div class="link-card"><div class="card-thumb">'+edition(2)+'</div><div class="meta">zuzu membership<br>Invited by Taranjeet · [personal invite link]</div></div><div class="delivered">Delivered</div>'+bubble('Oh I’ve been wanting to try this. Thank you!');
if(s===2)html+=bubble(`Neha is in. Invited by you.<p>You have ${n-1} invitation${n-1===1?'':'s'} left.</p>`)+bubble('Who has joined through me?',true)+bubble(`Neha joined through your invitation.<p>${n-1} of your ${n} invitations remain.</p>`);
if(s===3)html+=bubble('Can I invite one more person?',true)+bubble(`All ${n} of your current invitations have been used.<p>I’ll show your updated allowance here if it changes.</p>`);
chat.innerHTML=html;root.querySelector('#ref-caption').textContent=[`1 / 4 · Current allowance: ${n}. No quota used.`,`2 / 4 · Member forwards the invitation themselves.`,`3 / 4 · One successful join consumes one invitation.`,`4 / 4 · Existing link remains; new joins are blocked.`][s];root.querySelector('#ref-next').disabled=s===3;}
function save(){window.openai?.setWidgetState?.({modelContent:{cohort:cohort.value,step:Number(step.value)}})?.catch(()=>{});}
function restore(state){const s=state?.modelContent;if(s){cohort.value=s.cohort==='member'?'member':'employee';step.value=String(Math.max(0,Math.min(3,Number(s.step)||0)));}render();}
cohort.onchange=step.onchange=()=>{render();save()};root.querySelector('#ref-next').onclick=()=>{step.value=String(Math.min(3,Number(step.value)+1));render();save()};window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState)});restore(window.openai?.widgetState);
})();
